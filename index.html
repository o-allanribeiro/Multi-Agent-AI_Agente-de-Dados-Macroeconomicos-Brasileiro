<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstração do Agente de IA para Análise Econômica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #chat-window::-webkit-scrollbar {
            width: 8px;
        }
        #chat-window::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background-color: #94a3b8;
            border-radius: 10px;
            border: 3px solid #f1f5f9;
        }
        .typing-indicator span {
            animation: blink 1.4s infinite both;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: .2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: .4s;
        }
        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-2xl h-full sm:h-[90vh] flex flex-col bg-white rounded-2xl shadow-2xl">
        <!-- Cabeçalho -->
        <header class="p-4 border-b border-slate-200">
            <h1 class="text-xl font-bold text-slate-800">Agente de Pesquisa Econômica</h1>
            <p class="text-sm text-slate-500">Faça uma pergunta sobre IPCA, Desocupação, Gini, ou FBCF.</p>
        </header>

        <!-- Janela do Chat -->
        <main id="chat-window" class="flex-1 p-6 overflow-y-auto space-y-6">
            <!-- Mensagem inicial do Agente -->
            <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold text-sm shrink-0">IA</div>
                <div class="bg-slate-200 text-slate-800 p-3 rounded-lg rounded-tl-none">
                    <p class="text-sm">Olá! Sou seu assistente para análise de dados macroeconômicos. Como posso ajudar?</p>
                </div>
            </div>
        </main>

        <!-- Formulário de Entrada -->
        <footer class="p-4 border-t border-slate-200">
            <form id="chat-form" class="flex items-center gap-3">
                <input type="text" id="message-input" placeholder="Digite sua pergunta aqui..." class="flex-1 w-full px-4 py-2 bg-slate-100 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200" autocomplete="off">
                <button type="submit" id="submit-button" class="px-5 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                    <span>Enviar</span>
                </button>
            </form>
        </footer>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const submitButton = document.getElementById('submit-button');

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userMessage = messageInput.value.trim();
            if (userMessage) {
                addMessage(userMessage, 'user');
                messageInput.value = '';
                getAgentResponse(userMessage);
            }
        });

        function addMessage(text, sender, imageUrl = null) {
            const messageContainer = document.createElement('div');
            if (sender === 'user') {
                messageContainer.className = 'flex items-start gap-3 justify-end';
                messageContainer.innerHTML = `
                    <div class="bg-blue-600 text-white p-3 rounded-lg rounded-br-none">
                        <p class="text-sm">${text}</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-blue-200 flex items-center justify-center text-blue-800 font-bold text-sm shrink-0">Você</div>
                `;
            } else {
                messageContainer.className = 'flex items-start gap-3';
                let content = `<p class="text-sm">${text.replace(/\n/g, '<br>')}</p>`; // Converte quebras de linha
                if (imageUrl) {
                    content += `<img src="${imageUrl}" alt="Gráfico de Análise" class="mt-3 rounded-lg shadow-md max-w-sm w-full">`;
                }
                 messageContainer.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold text-sm shrink-0">IA</div>
                    <div class="bg-slate-200 text-slate-800 p-3 rounded-lg rounded-tl-none">
                        ${content}
                    </div>
                `;
            }
            chatWindow.appendChild(messageContainer);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const typingIndicator = document.createElement('div');
            typingIndicator.id = 'typing-indicator';
            typingIndicator.className = 'flex items-start gap-3';
            typingIndicator.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold text-sm shrink-0">IA</div>
                <div class="bg-slate-200 text-slate-800 p-3 rounded-lg rounded-tl-none typing-indicator">
                    <span class="w-2 h-2 bg-slate-500 rounded-full inline-block"></span>
                    <span class="w-2 h-2 bg-slate-500 rounded-full inline-block"></span>
                    <span class="w-2 h-2 bg-slate-500 rounded-full inline-block"></span>
                </div>
            `;
            chatWindow.appendChild(typingIndicator);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function getAgentResponse(question) {
            submitButton.disabled = true;
            showTypingIndicator();

            try {
                const response = await fetch('http://127.0.0.1:8000/ask-agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: question }),
                });

                removeTypingIndicator();

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                addMessage(data.text, 'agent', data.plot_base64);

            } catch (error) {
                console.error('Erro ao conectar com o agente:', error);
                removeTypingIndicator();
                addMessage('Desculpe, não consegui me conectar ao meu cérebro. Verifique se o servidor Python está rodando e tente novamente.', 'agent');
            } finally {
                submitButton.disabled = false;
                messageInput.focus();
            }
        }
    </script>
</body>
</html>
