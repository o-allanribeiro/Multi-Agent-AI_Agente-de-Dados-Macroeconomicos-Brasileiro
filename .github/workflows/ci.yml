name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      GOOGLE_API_KEY: dummy-key-for-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: |
          pytest tests/unit/ tests/integration/test_agent_flow.py tests/integration/test_api_endpoints.py
