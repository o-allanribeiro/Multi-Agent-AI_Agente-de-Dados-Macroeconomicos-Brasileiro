# =============================================================================
# config/aws.yaml — Infraestrutura AWS
# Projeto: Agente Macro-BR
#
# Configurações de recursos AWS usadas nos templates CloudFormation e Terraform.
# Não contém segredos — apenas nomes e parâmetros de infraestrutura.
#
# ORÇAMENTO ALVO: USD 100/mês (ver deployment/aws/cost-calculator.md)
# =============================================================================

aws:
  region: "us-east-1"      # Região principal (menor latência para BR após sa-east-1)
  # account_id: definido via variável de ambiente AWS_ACCOUNT_ID

# --- Elastic Container Service (Fargate) ---
ecs:
  cluster_name: "agente-macro-cluster"
  service_name: "agente-macro-api"
  task_family: "agente-macro-task"
  # Fargate Spot para redução de custos (~50-70% de desconto)
  capacity_provider: "FARGATE_SPOT"
  task_cpu: "256"           # 0.25 vCPU
  task_memory: "512"        # 512 MB

# --- Application Load Balancer ---
alb:
  name: "agente-macro-alb"
  health_check_path: "/health"
  health_check_interval: 30

# --- DynamoDB ---
dynamodb:
  table_name: "agente-macro-conversations"
  billing_mode: "PAY_PER_REQUEST"   # On-demand — sem custo fixo
  ttl_attribute: "expires_at"
  ttl_days: 90                      # Expiração automática de conversas

# --- S3 ---
s3:
  bucket_name: "agente-macro-assets"
  plots_prefix: "plots/"
  backups_prefix: "backups/"
  lifecycle_plots_days: 30          # Auto-delete gráficos após 30 dias

# --- CloudWatch ---
cloudwatch:
  log_group: "/ecs/agente-macro"
  retention_days: 30
  metric_namespace: "AgenteMacro/API"
  alarm_error_rate_threshold: 5     # % de erros para disparar alarme

# --- Secrets Manager ---
secrets_manager:
  google_api_key_name: "agente-macro/google-api-key"

# --- Auto Scaling ---
autoscaling:
  min_capacity: 1
  max_capacity: 3
  cpu_target_percent: 70
  memory_target_percent: 80
  scale_in_cooldown: 300
  scale_out_cooldown: 60

