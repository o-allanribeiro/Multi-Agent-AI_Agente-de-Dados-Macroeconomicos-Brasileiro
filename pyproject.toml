# =============================================================================
# pyproject.toml — Agente Macro-BR
# Projeto: Agente de IA para Análise de Dados Macroeconômicos Brasileiros
# Padrões: PEP 517/518/621, PEP 8, DataOps
# =============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agente-macro-br"
version = "0.1.0"
description = "Agente de IA autônomo para análise de indicadores macroeconômicos brasileiros"
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = [
    "ai",
    "machine-learning",
    "economics",
    "macroeconomics",
    "brazil",
    "langchain",
    "langgraph",
    "government",
    "data-science",
    "open-source",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Government",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    "langchain==0.2.1",
    "langgraph==0.0.57",
    "langchain-google-genai==1.0.6",
    "pandas==2.2.2",
    "matplotlib==3.9.0",
    "requests>=2.31.0",
    "python-bcb",
    "wbgapi==1.0.12",
    "python-dotenv==1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
]
aws = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "watchtower>=3.0.1",
]

[project.scripts]
agente-macro = "cli:main"

# --- setuptools: localiza pacotes dentro de src/ ---
[tool.setuptools.packages.find]
where = ["src"]

# =============================================================================
# Ferramentas de qualidade de código
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    \.git
  | venv
  | \.venv
  | __pycache__
  | \.mypy_cache
  | htmlcov
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["agente", "tools", "api", "storage", "logger", "utils"]
skip = ["venv", ".venv", "__pycache__"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
warn_unused_configs = true

# =============================================================================
# Pytest — Configuração de testes
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# pythonpath adiciona src/ ao PYTHONPATH para que imports funcionem sem prefixo
pythonpath = ["src"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "-v",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/__pycache__/*",
    "*/venv/*",
    "src/storage/dynamodb.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
